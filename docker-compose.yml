# Production deployment:  sudo bash scripts/install.sh   (or: cp .env.example .env, fill it in, docker compose up -d)
# Everything restarts by itself after a crash or a server reboot. See docs/PRODUCTION.md.

# Docker keeps container logs forever by default; cap them so they can never fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://wa:${POSTGRES_PASSWORD:-wa}@postgres:5432/wa
      REDIS_URL: redis://redis:6379
      MEDIA_DIR: /app/media
      PORT: 3000
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    logging: *logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wa}
      POSTGRES_DB: wa
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wa"]
      interval: 5s
      retries: 10
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    logging: *logging

  # Automatic HTTPS (Let's Encrypt). Point DOMAIN's DNS A record at this server first.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - app
    logging: *logging

  # Daily database backup to ./backups (compressed pg_dump), keeping BACKUP_KEEP_DAYS days.
  # The dump holds the WhatsApp logins encrypted with TOKEN_ENC_KEY: keep a copy of .env too.
  # Restore with: bash scripts/restore.sh backups/<file>.sql.gz
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-wa}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -o pipefail
        while true; do
          f="/backups/wa-$$(date +%Y%m%d-%H%M%S).sql.gz"
          if pg_dump -h postgres -U wa --clean --if-exists wa | gzip > "$$f.tmp"; then
            mv "$$f.tmp" "$$f"; echo "backup ok: $$f ($$(du -h "$$f" | cut -f1))"
          else
            rm -f "$$f.tmp"; echo "backup FAILED"
          fi
          find /backups -name 'wa-*.sql.gz' -mtime +$${BACKUP_KEEP_DAYS} -delete
          sleep 86400
        done
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

volumes:
  media:
  pgdata:
  redisdata:
  caddydata:
